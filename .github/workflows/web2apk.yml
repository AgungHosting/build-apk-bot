name: Web to APK

# Dipicu oleh bot Telegram (github.js -> triggerWeb2ApkWorkflow), dengan input:
#   web_url  : URL website yang mau dibungkus jadi APK (webview)
#   app_name : nama aplikasi yang muncul di HP
#   icon_url : URL gambar icon (idealnya persegi 1:1, misal 512x512)
on:
  workflow_dispatch:
    inputs:
      web_url:
        description: "URL website yang mau dibungkus jadi APK"
        required: true
        type: string
      app_name:
        description: "Nama aplikasi"
        required: false
        type: string
        default: "My WebApp"
      icon_url:
        description: "URL icon aplikasi (disarankan 512x512, persegi)"
        required: false
        type: string
        default: ""
      package_id:
        description: "ID unik per build (huruf kecil/angka), dipakai sebagai applicationId Android supaya tiap APK dianggap aplikasi terpisah, bukan update dari APK sebelumnya"
        required: false
        type: string
        default: "app"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.35.5"
          cache: true

      # PENTING soal instalasi APK di HP:
      # Android mengenali aplikasi lewat "applicationId" (com.xxx.yyy),
      # BUKAN lewat nama aplikasi yang tampil (app_name/android:label).
      # Kalau applicationId-nya SAMA persis dengan APK yang sudah
      # ter-install (mis. selalu "com.web2apk.webapp"), maka APK baru
      # akan dianggap Android sebagai UPDATE dari APK lama -> muncul
      # tombol "Update" (bukan "Install"), dan APK lama otomatis
      # tertimpa/hilang walau nama app-nya beda. Makanya org project di
      # sini WAJIB memuat `package_id` (unik per build, dikirim dari
      # bot) supaya applicationId tiap Web to APK berbeda-beda, dan
      # semua APK bisa ter-install berdampingan sebagai aplikasi terpisah.
      - name: Buat project Flutter baru
        run: flutter create webapp --org com.web2apk.${{ inputs.package_id }} --project-name webapp

      - name: Pastikan izin INTERNET ada di release AndroidManifest.xml
        working-directory: webapp
        run: |
          set -e
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # flutter create HANYA menambahkan izin INTERNET ke manifest
          # debug/profile, BUKAN ke manifest release yang dipakai
          # `flutter build apk --release`. Tanpa baris ini, APK release
          # tidak punya akses internet sama sekali dan WebView akan
          # menampilkan error net::ERR_CACHE_MISS / halaman "web tidak
          # tersedia" walau URL-nya sendiri valid dan bisa dibuka di browser.
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i '0,/<manifest /{s|<manifest \(.*\)>|<manifest \1>\n    <uses-permission android:name="android.permission.INTERNET"/>|}' "$MANIFEST"
            echo "Izin INTERNET ditambahkan ke $MANIFEST"
          else
            echo "Izin INTERNET sudah ada, skip."
          fi

      - name: Tambah dependency webview_flutter + flutter_launcher_icons
        working-directory: webapp
        run: |
          flutter pub add webview_flutter
          flutter pub add --dev flutter_launcher_icons

      - name: Tulis main.dart (WebView wrapper)
        working-directory: webapp
        run: |
          cat > lib/main.dart << 'EOF'
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          void main() => runApp(const WebApp());

          class WebApp extends StatelessWidget {
            const WebApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: '${{ inputs.app_name }}',
                home: const WebViewScreen(),
              );
            }
          }

          class WebViewScreen extends StatefulWidget {
            const WebViewScreen({super.key});

            @override
            State<WebViewScreen> createState() => _WebViewScreenState();
          }

          class _WebViewScreenState extends State<WebViewScreen> {
            late final WebViewController _controller;

            @override
            void initState() {
              super.initState();
              _controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..loadRequest(Uri.parse('${{ inputs.web_url }}'));
            }

            @override
            Widget build(BuildContext context) {
              return SafeArea(
                child: Scaffold(
                  body: WebViewWidget(controller: _controller),
                ),
              );
            }
          }
          EOF

      - name: Set nama aplikasi (Android label)
        working-directory: webapp
        run: |
          sed -i 's/android:label="webapp"/android:label="${{ inputs.app_name }}"/' \
            android/app/src/main/AndroidManifest.xml

      - name: Download icon (kalau ada)
        if: ${{ inputs.icon_url != '' }}
        working-directory: webapp
        run: |
          mkdir -p assets
          curl -L \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "${{ inputs.icon_url }}" -o assets/icon.png

          # Validasi cepat: pastikan yang ke-download itu benar PNG, bukan
          # JSON error/metadata (kalau ini gagal, cek lagi icon_url & token).
          if ! file assets/icon.png | grep -qi "PNG image data"; then
            echo "❌ File yang ke-download BUKAN gambar PNG yang valid. Isi file:"
            cat assets/icon.png
            exit 1
          fi

      - name: Generate launcher icon (kalau ada)
        if: ${{ inputs.icon_url != '' }}
        working-directory: webapp
        run: |
          cat >> pubspec.yaml << 'EOF'

          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/icon.png"
          EOF
          dart run flutter_launcher_icons

      - name: Flutter pub get
        working-directory: webapp
        run: flutter pub get

      - name: Build APK (release)
        working-directory: webapp
        run: |
          set -e
          # Gradle kadang gagal download dependency karena gangguan jaringan
          # sesaat di runner ("Gradle threw an error while downloading
          # artifacts from the network"). Retry otomatis dulu sebelum
          # benar-benar dianggap gagal.
          for i in 1 2 3; do
            echo "Percobaan build ke-$i..."
            if flutter build apk --release; then
              break
            fi
            if [ "$i" = "3" ]; then
              echo "Build tetap gagal setelah 3x percobaan."
              exit 1
            fi
            echo "Gagal, tunggu 15 detik lalu coba lagi..."
            sleep 15
          done

      - name: Siapkan folder output
        working-directory: webapp
        run: |
          mkdir -p ../apk-output
          cp build/app/outputs/flutter-apk/app-release.apk ../apk-output/

      # Nama artifact WAJIB mengandung kata "apk" karena index.js mencari
      # artifact lewat: a.name.toLowerCase().includes("apk")
      - name: Upload artifact APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-output
          path: apk-output/*.apk
          retention-days: 1
