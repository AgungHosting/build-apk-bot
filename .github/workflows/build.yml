# ============================================================
# File ini otomatis di-deploy oleh bot ke:
#   .github/workflows/build.yml
# di repo GITHUB_USERNAME/GITHUB_REPO (lihat settings.js).
#
# Repo target HANYA perlu berisi source Dart minimal
# (pubspec.yaml, lib/main.dart, lib/config.dart, assets/icon/icon.png)
# — juga otomatis di-deploy oleh bot dari folder flutter-template/.
# Folder platform "android/" TIDAK perlu ada di repo sama sekali;
# workflow ini yang men-generate-nya setiap kali build jalan,
# jadi repo template selalu bersih dan tidak perlu di-utak-atik manual.
# ============================================================

name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "ID unik build (dipakai sebagai tag release)"
        required: true
      app_name:
        description: "Nama aplikasi"
        required: true
      app_url:
        description: "URL website yang akan ditampilkan"
        required: true
      package_name:
        description: "Application ID / package name"
        required: true
      icon_url:
        description: "Link gambar ikon (opsional)"
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: "stable"

      - name: Generate Project Android (otomatis, aman diulang)
        run: flutter create --platforms=android .

      - name: Ganti Nama Aplikasi
        run: |
          sed -i "s/android:label=\"[^\"]*\"/android:label=\"${{ github.event.inputs.app_name }}\"/" android/app/src/main/AndroidManifest.xml

      - name: Ganti Package Name (Application ID)
        run: |
          sed -i "s/applicationId \".*\"/applicationId \"${{ github.event.inputs.package_name }}\"/" android/app/build.gradle
          sed -i "s/namespace \".*\"/namespace \"${{ github.event.inputs.package_name }}\"/" android/app/build.gradle

      - name: Ganti URL Website di Konfigurasi
        run: |
          echo "const String APP_URL = \"${{ github.event.inputs.app_url }}\";" > lib/config.dart

      - name: Pakai Ikon Custom (jika ada)
        if: ${{ github.event.inputs.icon_url != '' }}
        run: |
          curl -L "${{ github.event.inputs.icon_url }}" -o assets/icon/icon.png

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Ikon Aplikasi
        run: flutter pub run flutter_launcher_icons

      - name: Build APK Release
        run: flutter build apk --release

      - name: Rename APK Output
        run: |
          mkdir -p output
          cp build/app/outputs/flutter-apk/app-release.apk "output/${{ github.event.inputs.app_name }}.apk"

      - name: Buat GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.build_id }}
          name: "Build ${{ github.event.inputs.app_name }} (${{ github.event.inputs.build_id }})"
          files: output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
