name: Build APK (release)

# Dipicu oleh bot Telegram (github.js -> triggerWorkflow), dengan input:
#   source_url : URL API asset GitHub Release berisi source code Flutter (.zip)
#   tag        : nama tag release (dipakai untuk penamaan, opsional)
#   build_type : "debug" atau "release"
on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "URL asset (API GitHub) berisi source project .zip"
        required: true
        type: string
      tag:
        description: "Tag release"
        required: false
        type: string
        default: ""
      build_type:
        description: "debug atau release"
        required: false
        type: string
        default: "release"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download source zip dari GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          curl -L \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            "${{ inputs.source_url }}" \
            -o source.zip
          mkdir -p source
          unzip -q source.zip -d source
          # Kalau isi zip cuma 1 folder pembungkus, masuk ke situ.
          if [ "$(ls source | wc -l)" -eq 1 ] && [ -d "source/$(ls source)" ]; then
            mv "source/$(ls source)"/* source/ 2>/dev/null || true
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.35.5"   # versi terakhir sebelum IconData dijadikan final class (breaking change),
          cache: true                  # aman untuk font_awesome_flutter versi lama. Naikkan lagi kalau semua
                                        # dependency sudah dipastikan kompatibel dengan Flutter/Dart terbaru.

      - name: Patch dependency yang diketahui bermasalah (jaga-jaga)
        working-directory: source
        run: |
          set -e
          if grep -q "font_awesome_flutter" pubspec.yaml 2>/dev/null; then
            echo "Mengunci font_awesome_flutter ke versi yang kompatibel..."
            # Kalau versi yang tertulis di pubspec.yaml sudah lebih baru / pakai caret, biarkan.
            # Baris ini hanya jaga-jaga kalau versinya di-pin manual ke versi lama yang bikin error.
            sed -i -E 's/font_awesome_flutter:\s*\^?10\.[0-9]+\.[0-9]+/font_awesome_flutter: ^10.9.0/' pubspec.yaml || true
          fi

      - name: Pastikan izin INTERNET ada di release AndroidManifest.xml
        working-directory: source
        run: |
          set -e
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # Manifest release project Flutter (termasuk yang di-upload user)
          # sering tidak punya izin INTERNET secara eksplisit -- flutter
          # create hanya menaruhnya di manifest debug/profile. Kalau app
          # pakai WebView dan izin ini hilang, hasil APK release akan gagal
          # konek internet (muncul net::ERR_CACHE_MISS) meski URL-nya valid.
          if [ -f "$MANIFEST" ] && ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i '0,/<manifest /{s|<manifest \(.*\)>|<manifest \1>\n    <uses-permission android:name="android.permission.INTERNET"/>|}' "$MANIFEST"
            echo "Izin INTERNET ditambahkan ke $MANIFEST"
          fi

      - name: Flutter pub get
        working-directory: source
        run: flutter pub get

      - name: Build APK (debug)
        if: ${{ inputs.build_type == 'debug' }}
        working-directory: source
        run: flutter build apk --debug

      - name: Build APK (release, split per ABI)
        if: ${{ inputs.build_type != 'debug' }}
        working-directory: source
        run: |
          set -e
          # --split-per-abi menghasilkan APK terpisah per arsitektur
          # (armeabi-v7a, arm64-v8a, x86_64) alih-alih 1 APK "universal"
          # yang menggabungkan semuanya. APK universal gampang tembus 50MB+
          # kalau project punya banyak plugin/asset besar, dan Telegram Bot
          # API MENOLAK kirim file di atas 50MB dengan error
          # "413: Request Entity Too Large". APK arm64-v8a saja sudah
          # cukup untuk hampir semua HP Android modern dan jauh lebih kecil.
          #
          # --split-debug-info + --obfuscate membuang simbol debug native
          # dari APK (dipindah ke folder terpisah, tidak diupload) supaya
          # ukuran APK tidak bengkak oleh debug info yang sebenarnya tidak
          # dibutuhkan untuk instalasi/pemakaian normal.
          flutter build apk --release --split-per-abi \
            --split-debug-info=build/symbols --obfuscate

      - name: Diagnostik ukuran (biar ketahuan kalau APK tiba-tiba membengkak)
        working-directory: source
        run: |
          echo "===== Ukuran APK per arsitektur ====="
          ls -lhS build/app/outputs/flutter-apk/*.apk 2>/dev/null || echo "(tidak ada apk)"
          echo ""
          echo "===== 15 file/folder terbesar di assets/ ====="
          du -ah assets 2>/dev/null | sort -rh | head -15 || echo "(tidak ada folder assets)"
          echo ""
          echo "===== 20 file terbesar di seluruh source project ====="
          du -ah . 2>/dev/null | grep -v "^\./build/" | sort -rh | head -20

      - name: Siapkan folder output
        working-directory: source
        run: |
          set -e
          mkdir -p ../apk-output
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            cp build/app/outputs/flutter-apk/app-debug.apk ../apk-output/
          else
            # Ambil APK arm64-v8a (cukup untuk hampir semua HP modern &
            # jauh lebih kecil daripada APK universal). Kalau karena suatu
            # sebab file itu tidak ada, fallback ke APK TERKECIL yang ada
            # (bukan cuma "apapun yang ketemu") supaya hasilnya konsisten
            # dan tidak tergantung urutan file yang tidak terjamin.
            if [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
              cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../apk-output/app-release.apk
            else
              SMALLEST=$(ls -S build/app/outputs/flutter-apk/app-*release*.apk 2>/dev/null | tail -1)
              if [ -n "$SMALLEST" ]; then
                echo "⚠️ app-arm64-v8a-release.apk tidak ditemukan, pakai APK terkecil sebagai fallback: $SMALLEST"
                cp "$SMALLEST" ../apk-output/app-release.apk
              else
                cp build/app/outputs/flutter-apk/app-release.apk ../apk-output/
              fi
            fi
          fi
          ls -lh ../apk-output/

      # Nama artifact WAJIB mengandung kata "apk" karena index.js mencari
      # artifact lewat: a.name.toLowerCase().includes("apk")
      - name: Upload artifact APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-output
          path: apk-output/*.apk
          retention-days: 1
