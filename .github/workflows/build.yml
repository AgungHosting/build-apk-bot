# ============================================================
# File ini WAJIB ditaruh di REPO TEMPLATE FLUTTER kamu
# pada path: .github/workflows/build.yml
#
# Repo template Flutter minimal harus punya:
# - Project Flutter dengan WebView (webview_flutter) yang
#   membaca URL dari sebuah file konfigurasi, misalnya:
#   lib/config.dart -> const String APP_URL = "REPLACE_URL";
# - Package flutter_launcher_icons untuk ganti ikon otomatis
# ============================================================

name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "ID unik build (dipakai sebagai tag release)"
        required: true
      app_name:
        description: "Nama aplikasi"
        required: true
      app_url:
        description: "URL website yang akan ditampilkan"
        required: true
      package_name:
        description: "Application ID / package name"
        required: true
      icon_url:
        description: "Link gambar ikon (opsional)"
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: "stable"

      - name: Ganti Nama Aplikasi
        run: |
          sed -i "s/REPLACE_APP_NAME/${{ github.event.inputs.app_name }}/g" android/app/src/main/AndroidManifest.xml

      - name: Ganti URL Website di Konfigurasi
        run: |
          echo "const String APP_URL = \"${{ github.event.inputs.app_url }}\";" > lib/config.dart

      - name: Ganti Package Name (Application ID)
        run: |
          sed -i "s/REPLACE_PACKAGE_NAME/${{ github.event.inputs.package_name }}/g" android/app/build.gradle

      - name: Download Ikon Custom (jika ada)
        if: ${{ github.event.inputs.icon_url != '' }}
        run: |
          curl -L "${{ github.event.inputs.icon_url }}" -o assets/icon/icon.png

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Ikon Aplikasi
        if: ${{ github.event.inputs.icon_url != '' }}
        run: flutter pub run flutter_launcher_icons

      - name: Build APK Release
        run: flutter build apk --release

      - name: Rename APK Output
        run: |
          mkdir -p output
          cp build/app/outputs/flutter-apk/app-release.apk output/${{ github.event.inputs.app_name }}.apk

      - name: Buat GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.build_id }}
          name: "Build ${{ github.event.inputs.app_name }} (${{ github.event.inputs.build_id }})"
          files: output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
